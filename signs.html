        * {

        }

        body {
            min-height: 100vh;

            background: linear-gradient(135deg, #d5e8f5, #e8f2f8);
            color: #172033;
            padding: 18px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        /* سەردێڕ */
        .topbar {
            background: linear-gradient(135deg, #062d55, #075a9c);
            color: white;
            padding: 17px 20px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            box-shadow: 0 5px 15px rgba(6, 45, 85, 0.30);
        }

        .title {
            font-size: 21px;
            font-weight: bold;
        }

        /* تایمەر */
        .timer {
            background: #f2bd00;
            color: #172033;
            min-width: 60px;
            padding: 9px 13px;
            border-radius: 10px;
            text-align: center;
            font-size: 21px;
            font-weight: bold;
        }

            .timer.warning {
                background: #d62828;
                color: white;
            }

        /* ژمارەی پرسیار */
        .progress {
            background: #b9d8ee;
            color: #063b68;
            padding: 12px;
            border-radius: 11px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 12px;
            border: 1px solid #82b4d5;
        }

        /* بۆکسی پرسیار */
        .quiz-card {
            background: #f5faff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 18px rgba(20, 65, 100, 0.18);
        }

        .question {
            background: #cfe3f2;
            border-right: 6px solid #075a9c;
            padding: 15px;
            border-radius: 11px;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.8;
            margin-bottom: 17px;
            color: #082f52;
        }

        /* بۆکسی وێنە - تەنها ئەمە سپییە */
        .image-box {
            background: #ffffff;
            border: 2px solid #c7d7e3;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 18px;
        }

        .question-image {
            display: block;
            width: 100%;
            max-width: 430px;
            height: 270px;
            object-fit: contain;
            margin: auto;
            border-radius: 8px;
        }

        /* وەڵامەکان */
        .answers {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }


        .answer {
            width: 100%;
            padding: 17px 16px;
            border: 2px solid #91b8d5;
            border-radius: 11px;
            background: #d8eaf6;
            color: #123653;
            font-size: 19px;
            text-align: right;
            cursor: pointer;
            transition: 0.2s;
            line-height: 1.8;
        }


            .answer:hover:not(:disabled) {
                background: #c1ddef;
                border-color: #075a9c;
            }

            .answer:disabled {
                cursor: default;
            }

            /* وەڵامی ڕاست */
            .answer.correct {
                background: #b6e2c0;
                border: 2px solid #16803a;
                color: #075c25;
                font-weight: bold;
            }

            /* وەڵامی هەڵە */
            .answer.wrong {
                background: #f0baba;
                border: 2px solid #c62828;
                color: #a71919;
                font-weight: bold;
            }

        /* دوگمەی دواتر */
        .next-btn {
            width: 100%;
            margin-top: 18px;
            padding: 15px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #064b82, #06356d);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(6, 53, 109, 0.25);
        }

            .next-btn:hover:not(:disabled) {
                background: #042d5d;
            }

            .next-btn:disabled {
                background: #9ba8b4;
                cursor: not-allowed;
                box-shadow: none;
            }

        /* ئەنجام */
        .result {
            display: none;
            text-align: center;
        }

        .result-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 10px;
        }

            color: #064b82;
            margin-bottom: 15px;
        }

            color: #06356d;
            margin: 15px 0;
        }

            line-height: 2;

            clearInterval(timerInterval);

            const correctAnswer =
                questions[currentQuestion].Correct;

            const allAnswers =
                document.querySelectorAll(".answer");


            if (answer === correctAnswer) {

                score++;

                button.classList.add("correct");

            } else {

                button.classList.add("wrong");


                allAnswers.forEach(btn => {

                    const key =
                        btn.textContent.substring(0, 1);

                    if (key === correctAnswer) {
                        btn.classList.add("correct");
                    }

                });

            }


            disableAnswers();

            nextBtn.disabled = false;
        }


        function disableAnswers() {

            document
                .querySelectorAll(".answer")
                .forEach(button => {
                    button.disabled = true;
                });

        }


        nextBtn.addEventListener("click", function () {

            if (!selectedAnswer) {
                return;
            }

            nextQuestion();

        });


        function nextQuestion() {

            clearInterval(timerInterval);


            if (currentQuestion < questions.length - 1) {

                currentQuestion++;

                showQuestion();

            } else {

                showResult();

            }

        }


        function showResult() {

            clearInterval(timerInterval);

            quizArea.style.display = "none";
            resultArea.style.display = "block";

            finalScore.textContent =
                `${score} / ${questions.length}`;


            const answered =
                questions.length - unanswered;


            resultInfo.innerHTML = `

            <div>
                ✅ وەڵامی ڕاست:
                <strong>${score}</strong>
            </div>

            <div>
                ❌ وەڵامی هەڵە:
                <strong>${answered - score}</strong>
            </div>

            <div>
                ⏰ بێ وەڵام:
                <strong>${unanswered}</strong>
            </div>

            <div>
                📊 کۆی پرسیارەکان:
                <strong>${questions.length}</strong>
            </div>

        `;

        }


        function restartQuiz() {

            currentQuestion = 0;
            score = 0;
            unanswered = 0;
            selectedAnswer = false;

            resultArea.style.display = "none";
            quizArea.style.display = "block";

            showQuestion();

        }


        function goHome() {

            window.location.href = "index.html";

        }


        showQuestion();

    </script>

</body>
</html>

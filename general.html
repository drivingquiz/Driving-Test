
<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئیسعافات | Driving Test</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #d5e8f5, #e8f2f8);
            color: #172033;
            padding: 18px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .topbar {
            background: linear-gradient(135deg, #062d55, #075a9c);
            color: white;
            padding: 17px 20px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            box-shadow: 0 5px 15px rgba(6, 45, 85, 0.30);
            gap: 10px;
        }

        .title {
            font-size: 21px;
            font-weight: bold;
        }

        .timer {
            background: #f2bd00;
            color: #172033;
            min-width: 60px;
            padding: 9px 13px;
            border-radius: 10px;
            text-align: center;
            font-size: 21px;
            font-weight: bold;
        }

            .timer.warning {
                background: #d62828;
                color: white;
            }

        .progress {
            background: #b9d8ee;
            color: #063b68;
            padding: 12px;
            border-radius: 11px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 12px;
            border: 1px solid #82b4d5;
        }

        .quiz-card {
            background: #f5faff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 18px rgba(20, 65, 100, 0.18);
        }

        .question {
            background: #cfe3f2;
            border-right: 6px solid #075a9c;
            padding: 18px;
            border-radius: 11px;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.9;
            margin-bottom: 20px;
            color: #082f52;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .answer {
            width: 100%;
            padding: 15px 16px;
            border: 2px solid #91b8d5;
            border-radius: 11px;
            background: #d8eaf6;
            color: #123653;
            font-size: 17px;
            text-align: right;
            cursor: pointer;
            transition: 0.2s;
            line-height: 1.8;
        }

            .answer:hover:not(:disabled) {
                background: #c1ddef;
                border-color: #075a9c;
            }

            .answer:disabled {
                cursor: default;
            }

            .answer.correct {
                background: #b6e2c0;
                border: 2px solid #16803a;
                color: #075c25;
                font-weight: bold;
            }

            .answer.wrong {
                background: #f0baba;
                border: 2px solid #c62828;
                color: #a71919;
                font-weight: bold;
            }

        .next-btn {
            width: 100%;
            margin-top: 18px;
            padding: 15px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #064b82, #06356d);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(6, 53, 109, 0.25);
        }

            .next-btn:hover:not(:disabled) {
                background: #042d5d;
            }

            .next-btn:disabled {
                background: #9ba8b4;
                cursor: not-allowed;
                box-shadow: none;
            }

        .result {
            display: none;
            text-align: center;
        }

        .result-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .result h2 {
            color: #064b82;
            margin-bottom: 15px;
        }

        .score {
            font-size: 42px;
            font-weight: bold;
            color: #06356d;
            margin: 15px 0;
        }

        .result-info {
            line-height: 2;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .restart-btn,
        .home-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            margin-top: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .restart-btn {
            background: linear-gradient(135deg, #064b82, #06356d);
            color: white;
        }

        .home-btn {
            background: #c5dff1;
            color: #073b63;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .topbar {
                padding: 14px;
            }

            .title {
                font-size: 17px;
            }

            .timer {
                font-size: 18px;
                min-width: 52px;
            }

            .quiz-card {
                padding: 13px;
            }

            .question {
                font-size: 18px;
            }

            .answer {
                font-size: 16px;
                padding: 13px;
            }
        }
    </style>
</head>

<body>

        </div>

    </div>

                AnswerA: "بەیانیان.",

                AnswerC: "نیوەڕۆیان.",

                AnswerA: "104",

                AnswerA: "زیاد بوونی ڕۆن.",

                AnswerA: "دڵنیایی دەدەم لەوەی کە ئاسودەبێت و پەیوەندی بە تیمی   فریاگوزاریەوە دەکەم.",
                AnswerB: "ڕایدەکێشمە سەر زەوی.",
                AnswerC: "هیچ پەیوەندی بەمنەوە نیە.",

                AnswerB: "گەرمی و ئۆکسجین و ماددە.",
                AnswerC: "ڕوناکی و کارەبا و ئۆکسجین.",
                Correct: "B"
            },
            {
                Question: "لەکاتی کوژاندنەوەی   ئاگر پێویستە بوەستێن بە؟",
                AnswerA: "ئاڕاستەی با.",
                AnswerB: "پێچەوانەی ئاڕاستەی با.",
                AnswerC: "ڕوەو خۆر.",
                Correct: "A"
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let unanswered = 0;
        let selectedAnswer = false;
        let timeLeft = 60;
        let timerInterval;

        const questionElement = document.getElementById("question");
        const answersElement = document.getElementById("answers");
        const nextBtn = document.getElementById("nextBtn");
        const timerElement = document.getElementById("timer");
        const progressElement = document.getElementById("progress");

        const quizArea = document.getElementById("quizArea");
        const resultArea = document.getElementById("resultArea");

        const finalScore = document.getElementById("finalScore");
        const resultInfo = document.getElementById("resultInfo");

        function showQuestion() {
            clearInterval(timerInterval);

            selectedAnswer = false;
            nextBtn.disabled = true;
            timeLeft = 60;

            timerElement.textContent = timeLeft;
            timerElement.classList.remove("warning");

            const q = questions[currentQuestion];

            progressElement.textContent =
                `پرسیاری ${currentQuestion + 1} لە ${questions.length}`;

            questionElement.textContent = q.Question;
            answersElement.innerHTML = "";

            const answers = [
                { key: "A", text: q.AnswerA },
                { key: "B", text: q.AnswerB },
                { key: "C", text: q.AnswerC }
            ];

            answers.forEach(answer => {
                const button = document.createElement("button");
                button.className = "answer";
                button.textContent = answer.key + " ـ " + answer.text;

                button.onclick = function () {
                    selectAnswer(answer.key, button);
                };

                answersElement.appendChild(button);
            });

            nextBtn.textContent =
                currentQuestion === questions.length - 1
                    ? "ئەنجامەکان"
                    : "پرسیاری دواتر ←";

            startTimer();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                timerElement.textContent = timeLeft;

                if (timeLeft <= 10) {
                    timerElement.classList.add("warning");
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);

                    if (!selectedAnswer) {
                        unanswered++;
                        selectedAnswer = true;
                        disableAnswers();

                        setTimeout(() => {
                            nextQuestion();
                        }, 400);
                    }
                }
            }, 1000);
        }


        function selectAnswer(answer, button) {
            if (selectedAnswer) {
                return;
            }

            selectedAnswer = true;
            clearInterval(timerInterval);

            const correctAnswer = questions[currentQuestion].Correct;
            const allButtons = document.querySelectorAll(".answer");

            allButtons.forEach(btn => {
                btn.disabled = true;

                const letter = btn.textContent.trim().charAt(0);

                if (letter === correctAnswer) {
                    btn.classList.add("correct");
                }
            });

            if (answer === correctAnswer) {
                score++;
            } else {
                button.classList.add("wrong");
            }

            nextBtn.disabled = false;
        }


        function disableAnswers() {
            document.querySelectorAll(".answer").forEach(button => {
                button.disabled = true;
            });
        }

        nextBtn.addEventListener("click", function () {
            if (!selectedAnswer) {
                return;
            }

            nextQuestion();
        });

        function nextQuestion() {
            clearInterval(timerInterval);

            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            clearInterval(timerInterval);

            quizArea.style.display = "none";
            resultArea.style.display = "block";

            finalScore.textContent = `${score} / ${questions.length}`;

            const answered = questions.length - unanswered;

            resultInfo.innerHTML = `
                    <div>✅ وەڵامی ڕاست: <strong>${score}</strong></div>
                    <div>❌ وەڵامی هەڵە: <strong>${answered - score}</strong></div>
                    <div>⏰ بێ وەڵام: <strong>${unanswered}</strong></div>
                    <div>📊 کۆی پرسیارەکان: <strong>${questions.length}</strong></div>
                `;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            unanswered = 0;
            selectedAnswer = false;

            resultArea.style.display = "none";
            quizArea.style.display = "block";

            showQuestion();
        }

        function goHome() {
            window.location.href = "index.html";
        }

        showQuestion();
    </script>
